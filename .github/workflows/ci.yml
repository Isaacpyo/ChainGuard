name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.5.1
  NODE_VERSION: 22

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Format
        working-directory: packages/contracts
        run: forge fmt --check
      - name: Build
        working-directory: packages/contracts
        run: forge build --sizes
      - name: Test (unit, fuzz, invariant, attack scenarios)
        working-directory: packages/contracts
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generated ABI is up to date
        run: |
          node packages/contracts/script/export-abi.mjs
          git diff --exit-code packages/shared/src/abi || (echo "::error::Run 'forge build && npm run abi' and commit the result" && exit 1)

  node:
    name: Lint, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chainguard
          POSTGRES_PASSWORD: chainguard
          POSTGRES_DB: chainguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chainguard" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://chainguard:chainguard@localhost:5432/chainguard
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # anvil powers the end-to-end attack simulation integration test
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  e2e:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    needs: node
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chainguard
          POSTGRES_PASSWORD: chainguard
          POSTGRES_DB: chainguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chainguard" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://chainguard:chainguard@localhost:5432/chainguard
      E2E_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        run: docker compose build
